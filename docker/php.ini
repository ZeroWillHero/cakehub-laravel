; Upload limits for CakeHub (copied into the PHP-FPM image by the Dockerfile).
;
; The php:*-fpm-alpine base image ships no php.ini, so PHP's defaults apply
; (upload_max_filesize=2M, post_max_size=8M). Anything over post_max_size
; makes Laravel's ValidatePostSize middleware return 413 Payload Too Large,
; even though the FormRequests allow images up to 20 MB (max:20480).
;
; Keep these in line with:
;   - the largest FormRequest `max:` rule (20480 KB = 20 MB, product/logo/
;     cover/category/ad images) and resources/js/lib/files.ts IMAGE_RULE
;   - nginx client_max_body_size in docker/nginx.conf (must be >= post_max_size)
upload_max_filesize = 20M
; A little headroom over one file for the other multipart form fields.
post_max_size = 25M
max_file_uploads = 20
; Large photos are forwarded to Cloudinary inside the request.
max_execution_time = 120
max_input_time = 120
memory_limit = 256M
