services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - app-network

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "80"
    networks:
      - app-network
    dns:
      - 8.8.8.8
      - 8.8.4.4

  queue:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    command: php artisan queue:work --tries=3 --sleep=3
    networks:
      - app-network
    dns:
      - 8.8.8.8
      - 8.8.4.4

volumes:
  caddy_data:
  caddy_config:

networks:
  app-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"
    ipam:
      config:
        - subnet: 172.20.0.0/16
        - subnet: 2001:db8:1234::/64
